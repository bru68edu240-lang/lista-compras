<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FF94C8">
<title>Lista de Compras</title>
<style>
:root{--bg:#F5F5F5;--card:#fff;--tx:#141414;--mut:#808080;--ln:#EFE9E4;--ac:#FF94C8;--dg:#4A2C2A;--sh:0 8px 24px rgba(20,20,20,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:130px}
body{margin:0;min-height:100vh;color:var(--tx);font:400 17px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(60% 38% at 100% 0,rgba(197,138,249,.28),transparent 70%),radial-gradient(55% 34% at 0 6%,rgba(255,148,200,.30),transparent 70%),var(--bg);background-attachment:fixed}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 140px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#141414,#4A2C2A);box-shadow:var(--sh)}
.hero h1{font-size:24px;line-height:1.15;margin:0 0 4px;font-weight:700}
.hero p{margin:0;font-size:14px;opacity:.85}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.18)}
.ring .fg{stroke:var(--ac);stroke-dasharray:163.4;stroke-dashoffset:163.4;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;padding:12px 0 10px;margin-top:4px;background:rgba(245,245,245,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 6px 0 14px;box-shadow:var(--sh)}
.search>svg{width:20px;height:20px;color:var(--mut);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;padding:13px 4px;color:var(--tx)}
.icb{border:0;background:var(--ln);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;color:var(--tx);flex:none}
.icb svg{width:20px;height:20px}
.tabs{display:flex;gap:6px;margin-top:10px;background:rgba(20,20,20,.06);padding:4px;border-radius:16px}
.tb{flex:1;font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 6px;background:transparent;color:var(--mut);transition:.2s}
.tb.on{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(20,20,20,.1)}
.tb b{margin-left:6px;font-size:13px;background:var(--ac);color:#141414;border-radius:20px;padding:1px 8px}
#app{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.cat{background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.ch{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;font:inherit;color:var(--tx);text-align:left}
.em{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:rgba(255,148,200,.22)}
.cat:nth-child(3n+2) .em{background:rgba(197,138,249,.22)}
.cat:nth-child(3n) .em{background:rgba(255,158,158,.25)}
.cn{flex:1;font-weight:600}
.cc{font-size:13px;color:var(--mut)}
.chev{width:20px;height:20px;color:var(--mut);transition:transform .25s}
.fold .chev{transform:rotate(-90deg)}
.bd{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s ease}
.fold .bd{grid-template-rows:0fr}
.in{overflow:hidden;min-height:0}
.it{display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--ln);max-height:72px;overflow:hidden;transition:max-height .25s,opacity .2s,transform .25s,border-color .25s}
.it.out{max-height:0;opacity:0;transform:translateX(28px);border-color:transparent}
.ck{position:relative;flex:1;display:flex;align-items:center;gap:12px;padding:12px 0;min-width:0}
.ck input{position:absolute;opacity:0;pointer-events:none}
.bx{width:26px;height:26px;border-radius:50%;border:2px solid #d8d2cc;display:grid;place-items:center;flex:none;transition:.2s}
.bx svg{width:16px;height:16px;fill:none;stroke:#141414;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s .05s}
.ck input:checked+.bx{background:var(--ac);border-color:var(--ac);transform:scale(1.08)}
.ck input:checked+.bx svg{stroke-dashoffset:0}
.nm{min-width:0}
.q{color:var(--mut);font-size:15px;white-space:nowrap}
.it.done .nm,.it.done .q{text-decoration:line-through;color:var(--mut)}
.qi{display:none;width:76px;font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--ln);border-radius:10px;background:transparent;color:var(--tx)}
.x{display:none;background:none;border:0;color:var(--dg);font-size:24px;padding:0 4px}
.edit .qi,.edit .x{display:block}
.edit .q{display:none}
.add{display:none;gap:6px;padding:10px 14px;border-top:1px solid var(--ln)}
.edit .add{display:flex}
.add input{font:inherit;padding:10px;border:1px solid var(--ln);border-radius:12px;background:transparent;color:var(--tx);min-width:0}
.add .n{flex:1}.add .m{width:72px}
.add button,.pri{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;background:var(--ac);color:#141414}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.dcard{background:var(--card);border-radius:22px;box-shadow:var(--sh);text-align:center;padding:28px 18px}
.dcard .big{font-size:44px}
.dcard h3{margin:6px 0}
.dcard p{margin:0 0 16px;color:var(--mut)}
.bar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);max-width:420px;display:flex;gap:6px;padding:6px;border-radius:22px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(20,20,20,.15)}
.sb{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 6px;border-radius:16px;transition:.2s}
.sb svg{width:22px;height:22px}
.sb.on{background:var(--ac);color:#141414}
.sb.dg{background:var(--dg);color:#fff}
.toast{position:fixed;z-index:7;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;background:#141414;color:#fff;padding:11px 14px 11px 18px;border-radius:16px;font-size:15px;transition:.25s;width:max-content;max-width:calc(100% - 24px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--ac);font:inherit;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div><h1>Lista de Compras</h1><p id="sub">0 de 0 itens no carrinho</p></div>
    <div class="ring"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="rg" cx="32" cy="32" r="26" transform="rotate(-90 32 32)"/></svg><b id="pc">0%</b></div>
  </header>
  <div class="top">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
      <input id="q" type="search" placeholder="Buscar item…" autocomplete="off" enterkeyhint="search">
      <button class="icb" id="fa" aria-label="Recolher ou expandir categorias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4 -4l4 4"/><path d="M16 15l-4 4l-4 -4"/></svg></button>
    </div>
    <div class="tabs"><button class="tb on" id="t1">Faltam <b id="c1">0</b></button><button class="tb" id="t2">Comprados <b id="c2">0</b></button></div>
  </div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"><span id="tm"></span><button id="tu">Desfazer</button></div>
<nav class="bar"><button class="sb" id="ed"></button><button class="sb" id="rs"></button></nav>
<script>
var KEY="listaCompras.v4",FK="listaCompras.v2.fold",CIRC=163.4;
var DEF={
"Mercearia":"Arroz|5 kg;Feijão|3 kg;Açúcar|5 kg;Sal|1 kg;Farinha de trigo|2 kg;Farinha de mandioca|1 kg;Fubá|1 kg;Amaciante p pão|1;Aveia|500 g;Amido de milho|1 cx;Fermento químico|1 un;Fermento biológico|1 sachê;Leite condensado|4;Creme de leite|6;Leite de coco|1;Coco ralado|1;Achocolatado|500 g;Café|2 kg;Batata palha|1;Mel|1;Cereal matinal|1;Espaguete|2 kg;Parafuso|1 kg;Lasanha|1 pct;Macarrão instantâneo|4;Milho / ervilha|2;Milho|1;Molho de tomate|2;Azeitonas|2;Óleo|3 l;Azeite|1 l;Vinagre|1;Vinagre balsâmico|1;Ketchup|1;Maionese|1;Orégano|1;Chimichurri|1;Biscoito maria|1;Biscoito maisena|3;Bolacha recheada|1;Pipoca|1;Saco de balas|1",
"Carnes":"Peito de frango|2 kg;Coxa/sobrecoxa|3 kg;Carne bovina|4 kg;Carne moída|500 g;Carne suína|3 kg;Peixe|2 kg;Linguiça|1 kg;Bacon|500 g;Carne seca|500 g;Ovos|3 dúzias;Costela salgada|500 g;Pão de queijo|1;Fígado de frango|1 kg",
"Laticínios":"Leite|12 l;Manteiga|200 g;Requeijão|200 g;Muçarela|500 g;Presunto|500 g;Mortadela|500 g;Iogurte|4;Parmesão|1 pct;Margarina|500 g;Batata frita|1",
"Verduras e Legumes":"Batata|1 kg;Batata-doce|1 kg;Cenoura|1 kg;Tomate|1 kg;Cebola|2 kg;Abobrinha|500 g;Brócolis|1;Pimentão|3;Alho|1 kg;Alface|1;Repolho|1",
"Frutas":"Banana|6;Maçã|2;Laranja|6;Uva|1;Mamão|2;Melão|1;Melancia|1;Manga|3;Limão|6;Kiwi|1;Ameixa|2",
"Bebidas":"Vinho|1;Cerveja|6;Refrigerante 2 l|3;Refrigerante mini|24;Energético|1",
"Limpeza":"Sabão em pó|2 kg;Bucha de banho|1;Amaciante|2;Água sanitária|4;Desinfetante|1;Detergente|8;Multiuso|1;Prestobarba|1;Sabão em barra|1;Álcool líquido|1;Esponjas|1;Papel toalha|1;Bombril|1;Papel alumínio|1;Filme plástico|1;Papel manteiga|1;Palitos|1",
"Higiene":"Papel higiênico|2 pct;Shampoo|1;Sabonetes|15;Creme dental adulto|1;Creme dental criança|1;Escova de dente|2;Fio dental|1;Cotonetes|1"
};
var EM={"Mercearia":"🥫","Carnes":"🥩","Laticínios":"🧀","Verduras e Legumes":"🥦","Frutas":"🍎","Bebidas":"🥤","Limpeza":"🧼","Higiene":"🧴"};
function sv(i){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+i+'</svg>'}
var IC={
pen:sv('<path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"/><path d="M13.5 6.5l4 4"/>'),
refresh:sv('<path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/>'),
check:sv('<path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M9 12l2 2l4 -4"/>'),
alert:sv('<path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M12 8v4"/><path d="M12 16h.01"/>'),
chev:sv('<path d="M6 9l6 6l6 -6"/>').replace("<svg",'<svg class="chev"')
};
var S=null,fold={},editing=false,confirmReset=false,tab="faltam",qs="",qraw="",tt=null;
function $(i){return document.getElementById(i)}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function vis(it){if(qs&&norm(it.t).indexOf(qs)<0)return false;return editing||(tab==="comprados"?it.d:!it.d)}
function fresh(){var c=[];for(var k in DEF)c.push({n:k,i:DEF[k].split(";").map(function(s){var p=s.split("|");return{t:p[0],q:p[1]||"",d:false}})});return c}
function load(){try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r)}}catch(e){}if(!S||!S.length)S=fresh();fold={};S.forEach(function(c){fold[c.n]=1})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function saveFold(){try{localStorage.setItem(FK,JSON.stringify(fold))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hideToast(){$("toast").classList.remove("show")}
function toast(m,u){clearTimeout(tt);$("tm").textContent=m;$("tu").onclick=function(){u();hideToast()};$("toast").classList.add("show");tt=setTimeout(hideToast,2000)}
function resetAll(){S.forEach(function(c){c.i.forEach(function(i){i.d=false})});save();hideToast();render();window.scrollTo(0,0)}
function render(){
  var tot=0,dn=0,h="";
  S.forEach(function(c,ci){
    c.i.forEach(function(x){tot++;if(x.d)dn++});
    if(!c.i.some(vis))return;
    var open=editing||qs||!fold[c.n],cd=c.i.filter(function(x){return x.d}).length;
    h+='<section class="cat'+(editing?' edit':'')+(open?'':' fold')+'"><button class="ch" data-fold="'+ci+'"><span class="em">'+(EM[c.n]||"📦")+'</span><span class="cn">'+esc(c.n)+'</span><span class="cc">'+cd+'/'+c.i.length+'</span>'+IC.chev+'</button><div class="bd"><div class="in">';
    c.i.forEach(function(it,ii){
      if(!vis(it))return;
      h+='<div class="it'+(it.d&&tab!=="comprados"?' done':'')+'"><label class="ck"><input type="checkbox" '+(it.d?'checked ':'')+'data-c="'+ci+'" data-i="'+ii+'"><i class="bx"><svg viewBox="0 0 24 24"><path d="M5 12l5 5l9-10"/></svg></i><span class="nm">'+esc(it.t)+'</span></label><span class="q">'+esc(it.q)+'</span><input class="qi" value="'+esc(it.q)+'" data-qc="'+ci+'" data-qi="'+ii+'" maxlength="12" aria-label="Quantidade"><button class="x" data-del="'+ci+'_'+ii+'" aria-label="Remover">×</button></div>';
    });
    h+='<div class="add"><input class="n" id="a'+ci+'" placeholder="Novo item…" maxlength="60"><input class="m" id="m'+ci+'" placeholder="Qtd" maxlength="12"><button data-add="'+ci+'">+</button></div></div></div></section>';
  });
  if(!h){
    if(qs)h='<div class="empty">Nenhum item encontrado para “'+esc(qraw)+'”.</div>';
    else if(tab==="comprados")h='<div class="empty">Nada comprado ainda.<br>Os itens que você marcar aparecem aqui.</div>';
    else if(tot&&dn===tot)h='<div class="dcard"><div class="big">🎉</div><h3>Tudo certo!</h3><p>Você comprou tudo. Comece um novo mês para trazer os itens de volta.</p><button class="pri" data-reset="1">Começar novo mês</button></div>';
    else h='<div class="empty">A lista está vazia.</div>';
  }
  $("app").innerHTML=h;
  var p=tot?dn/tot:0;
  $("rg").style.strokeDashoffset=CIRC*(1-p);
  $("pc").textContent=Math.round(p*100)+"%";
  $("sub").textContent=dn+" de "+tot+" itens no carrinho";
  $("c1").textContent=tot-dn;$("c2").textContent=dn;
  $("t1").className="tb"+(tab==="faltam"?" on":"");$("t2").className="tb"+(tab==="comprados"?" on":"");
  var ed=$("ed");ed.className="sb"+(editing?" on":"");ed.innerHTML=(editing?IC.check:IC.pen)+"<span>"+(editing?"Concluir":"Editar")+"</span>";
  var rs=$("rs");rs.className="sb"+(confirmReset?" dg":"");rs.innerHTML=(confirmReset?IC.alert:IC.refresh)+"<span>"+(confirmReset?"Confirmar":"Novo mês")+"</span>";
}
var app=$("app");
app.addEventListener("change",function(e){
  var t=e.target,d=t.dataset;
  if(d.c!==undefined){
    var it=S[d.c].i[d.i],row=t.closest(".it"),on=t.checked;
    var go=function(){it.d=on;save();render()};
    if(!editing&&row){row.classList.add("out");setTimeout(go,230)}else go();
    toast(it.t+(on?" comprado":" voltou para Faltam"),function(){it.d=!on;save();render()});
    try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}
  }else if(d.qc!==undefined){S[d.qc].i[d.qi].q=t.value.trim();save()}
});
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.fold!==undefined){var n=S[d.fold].n,f=b.parentNode.classList.toggle("fold");if(f)fold[n]=1;else delete fold[n];saveFold();return}
  if(d.del){var p=d.del.split("_");S[p[0]].i.splice(p[1],1);save();render();return}
  if(d.reset){resetAll();return}
  if(d.add!==undefined){var ci=d.add,v=$("a"+ci).value.trim(),m=$("m"+ci).value.trim();if(v){S[ci].i.push({t:v,q:m,d:false});save();render();var n2=$("a"+ci);if(n2)n2.focus()}}
});
app.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.parentNode.className==="add"){e.target.parentNode.querySelector("button").click()}
});
$("q").addEventListener("input",function(){qraw=this.value.trim();qs=norm(qraw);render()});
$("fa").onclick=function(){var any=S.some(function(c){return !fold[c.n]});S.forEach(function(c){if(any)fold[c.n]=1;else delete fold[c.n]});saveFold();render()};
$("t1").onclick=function(){tab="faltam";render()};
$("t2").onclick=function(){tab="comprados";render()};
$("ed").onclick=function(){editing=!editing;confirmReset=false;render()};
$("rs").onclick=function(){
  if(!confirmReset){confirmReset=true;render();setTimeout(function(){confirmReset=false;render()},4000);return}
  confirmReset=false;resetAll();
};
load();render();
try{if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}}catch(e){}
</script>
</body>
</html>
